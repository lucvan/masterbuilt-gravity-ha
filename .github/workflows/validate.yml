name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches breakage from new Home Assistant releases rather than waiting for
    # a user to hit it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      # Its own process: it asserts on sys.modules, which any control-enabled
      # test earlier in the same run would already have polluted.
      - name: Read-only isolation
        run: pytest tests/test_readonly_isolation.py
      - name: Flows, migration, control and model profiles
        run: pytest --ignore=tests/test_readonly_isolation.py

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
